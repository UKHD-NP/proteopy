name: Python quality

on:
  push:
  pull_request:
    branches: ["main", "dev*", "dev/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and quality tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/requirements_ci-cd.txt
          python -m pip install -e .

      - name: Check formatting with Black
        shell: bash
        run: black --check --diff .

      - name: Lint with flake8
        shell: bash
        run: flake8 .

      - name: Lint with pylint
        shell: bash
        run: |
          pylint \
            $(git ls-files \
              "proteopy/*.py" "proteopy/**/*.py" \
              "tests/*.py" "tests/**/*.py") \
            --disable=all \
            --enable=E,F

      - name: Get month
        id: date
        shell: bash
        run: echo "month=$(date +'%Y-%m')" >> "$GITHUB_OUTPUT"

      - name: Get pooch cache directory
        id: cache-dir
        shell: python
        run: |
          import os

          import pooch

          cache = str(pooch.os_cache("proteopy"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"path={cache}\n")

      - name: Cache downloaded datasets
        uses: actions/cache@v4
        with:
          path: ${{ steps.cache-dir.outputs.path }}
          key: proteopy-datasets-${{ runner.os }}-${{ steps.date.outputs.month }}

      - name: Test with pytest
        run: pytest -v -s tests/
