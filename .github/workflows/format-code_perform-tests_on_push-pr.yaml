#  python linting - pylint and flake8
#  pytest

name: Python application using pip

on:

  push:
    branches: [ "main", "dev*", "dev/**" ]

  pull_request:
    branches: [ "main", "dev*", "dev/**" ]

  workflow_dispatch:
  
permissions:
  contents: read

jobs:

  build:

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:

      - uses: actions/checkout@v4
      
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 pytest
          if [ -f "requirements/requirements_ci-cd.txt" ]; then
            pip install -r requirements/requirements_ci-cd.txt
          fi

      - name: Install package
        shell: bash
        run: |
          pip install -e .

      - name: Collect Python files
        id: pyfiles
        shell: bash
        run: |
          PY_FILES=$(git ls-files "*.py" | grep -vE "^docs/")
          echo "PY_FILES<<EOF" >> "$GITHUB_ENV"
          echo "$PY_FILES" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Strict lint with flake8
        shell: bash
        run: |
          # Syntax errors / undefined names
          flake8 $PY_FILES \
            --statistics \
            --count \
            --show-source \
            --select=E9,F63,F82
          # On clean files (manually increment)
          flake8 \
            proteopy/ann/proteins.py \
            proteopy/datasets/williams_2018.py \
            proteopy/datasets/karayel_2020.py \
            proteopy/download/williams_2018.py \
            proteopy/download/karayel_2020.py \
            proteopy/pl/sequence.py \
            proteopy/pp/quantification.py \
            proteopy/pp/imputation.py \
            proteopy/read/long.py \
            proteopy/get/proteoforms.py \
            proteopy/utils/anndata.py \
            proteopy/utils/stat_tests.py \
            tests/__init__.py \
            tests/pp/test_filtering.py \
            tests/pp/test_quantification.py \
            tests/read/__init__.py \
            tests/tl/__init__.py \
            tests/utils/__init__.py \
            tests/datasets/__init__.py \
            tests/datasets/test_karayel_2020.py \
            tests/datasets/test_williams_2018.py \
            tests/download/__init__.py \
            tests/download/test_karayel_2020.py \
            tests/download/test_williams_2018.py \
            tests/utils/test_anndata.py \
            tests/read/test_long.py \
            tests/utils/test_parsers.py \
            --statistics \
            --count \
            --show-source \
            --max-complexity=10 \
            --max-line-length=127

      - name: Optional flake8 stats
        shell: bash
        run: |
          # optional linting stats
          flake8 $PY_FILES \
            --exit-zero \
            --statistics \
            --count \
            --show-source \
            --max-complexity=10 \
            --max-line-length=127

      - name: Lint with pylint
        shell: bash
        run: |
          pylint $PY_FILES --disable=all --enable=E,F

      - name: Get month
        id: date
        shell: bash
        run: echo "month=$(date +'%Y-%m')" >> "$GITHUB_OUTPUT"

      - name: Get pooch cache directory
        id: cache-dir
        shell: python
        run: |
          import pooch, os
          cache = str(pooch.os_cache("proteopy"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"path={cache}\n")

      - name: Cache downloaded datasets
        uses: actions/cache@v4
        with:
          path: ${{ steps.cache-dir.outputs.path }}
          key: proteopy-datasets-${{ runner.os }}-${{ steps.date.outputs.month }}

      - name: Test with pytest
        run: |
          pytest -v -s tests/
